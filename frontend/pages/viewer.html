<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document reference · Know</title>
    <link rel="stylesheet" href="/css/viewer.css" />
  </head>
  <body>
    <header class="viewer-header">
      <div class="viewer-header-left">
        <strong id="viewer-title">Document reference</strong>
        <span id="viewer-badge" class="viewer-badge" hidden></span>
      </div>
      <div class="viewer-header-right">
        <a id="viewer-external-link" class="viewer-action-btn" target="_blank" rel="noopener" hidden>Open live webpage ↗</a>
        <span id="viewer-status"><span class="viewer-spinner"></span> Loading…</span>
      </div>
    </header>
    <main id="pdf-document" class="viewer-main"></main>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.min.mjs" type="module"></script>
    <script src="/js/viewer.js" type="module"></script>
  </body>
</html>
